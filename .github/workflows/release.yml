name: Prepare verified Windows release draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (must match CitrusVersion.props)
        required: true
        type: string
      signing:
        description: Optional installer-only signing (requires approved free SignPath Foundation setup)
        required: true
        default: unsigned
        type: choice
        options: [unsigned, signpath]
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  release_state:
    runs-on: ubuntu-latest
    outputs:
      prepare: ${{ steps.state.outputs.prepare }}
    steps:
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if existing=$(gh release view "$REQUESTED_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) && [ "$existing" = false ]; then
            echo 'prepare=false' >> "$GITHUB_OUTPUT"
            echo 'Published release is immutable; no installer rebuild is required.'
          else
            echo 'prepare=true' >> "$GITHUB_OUTPUT"
          fi
  windows-preview:
    needs: release_state
    if: needs.release_state.outputs.prepare == 'true'
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CITRUS_SIGNING: ${{ inputs.signing || 'unsigned' }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      SIGNPATH_ALLOWED_SIGNER_THUMBPRINTS: ${{ vars.SIGNPATH_ALLOWED_SIGNER_THUMBPRINTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact version tag
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [xml]$versions=Get-Content CitrusVersion.props
          $version=[string]$versions.Project.PropertyGroup.Version
          if($env:REQUESTED_TAG -cne ('v'+$version)){throw 'Tag must match the central application and installer version'}
          "CITRUS_RELEASE_TAG=$env:REQUESTED_TAG" >> $env:GITHUB_ENV
          "CITRUS_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Require approved SignPath configuration before building
        if: inputs.signing == 'signpath'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: python packaging/signpath/verify-installer.py preflight
      - name: Fetch pinned NSIS 3.11 compiler
        shell: pwsh
        run: |
          $toolRoot=Join-Path $env:RUNNER_TEMP 'citrus-nsis-3.11'
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          $archive=Join-Path $toolRoot 'nsis-3.11.zip'
          Invoke-WebRequest 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip' -OutFile $archive
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1'){throw 'NSIS compiler archive hash mismatch'}
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
          $compiler=Join-Path $toolRoot 'nsis-3.11/makensis.exe'
          if(!(Test-Path -LiteralPath $compiler -PathType Leaf)){throw 'Pinned compiler executable missing'}
          "MAKENSIS=$compiler" >> $env:GITHUB_ENV
      - name: Restore frozen, individually pinned offline engines
        run: python packaging/bootstrap-engines.py
      - name: Restore, build and test source
        shell: pwsh
        run: |
          dotnet restore Citrus.sln --locked-mode
          if($LASTEXITCODE){throw 'Locked restore failed'}
          dotnet build Citrus.sln -c Release --no-restore -m:1
          if($LASTEXITCODE){throw 'Source build failed'}
          dotnet test tests/Citrus.Core.Tests -c Release --no-build --no-restore
          if($LASTEXITCODE){throw 'Core contracts failed'}
          dotnet test tests/Citrus.Windows.Tests -c Release --no-build --no-restore --filter 'FullyQualifiedName~Update'
          if($LASTEXITCODE){throw 'Managed updater contracts failed'}
      - name: Verify updater metadata and real isolated installer transitions
        shell: pwsh
        run: |
          python packaging/test-update-metadata.py
          if($LASTEXITCODE){throw 'Updater metadata contracts failed'}
          python packaging/test-signpath.py
          if($LASTEXITCODE){throw 'Signing verification contracts failed'}
          python packaging/test-update-installer.py
          if($LASTEXITCODE){throw 'Native installer transition fixtures failed'}
      - name: Build complete offline installer and verify prepared inventory
        shell: pwsh
        run: |
          ./packaging/publish.ps1
          # publish.ps1 already verifies every candidate pin and the sealed inventory.
          # Keep exhaustive, repeated missing-asset scans separate from release preparation.
          python packaging/test-package.py
          if($LASTEXITCODE){throw 'Complete package tests failed'}
      # Initial scope is the outer installer only. Installed Citrus binaries,
      # the NSIS uninstaller, and third-party binaries retain their original bytes.
      - name: Upload this exact unsigned installer for origin-verified signing
        if: inputs.signing == 'signpath'
        id: signpath-upload
        uses: actions/upload-artifact@v4
        with:
          name: citrus-unsigned-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/Citrus-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Request free Foundation signing and wait for manual approval
        if: inputs.signing == 'signpath'
        # Official v3.0.0, resolved from SignPath's v3 ref on 2026-10-21.
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-upload.outputs.artifact-id }}
          parameters: |
            version: "${{ env.CITRUS_RELEASE_VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/citrus-signpath-returned
      - name: Require trusted returned signature and the unchanged installer payload
        if: inputs.signing == 'signpath'
        shell: pwsh
        env:
          SIGNED_DIRECTORY: ${{ runner.temp }}/citrus-signpath-returned
        run: |
          python packaging/signpath/verify-installer.py accept --signed-directory "$env:SIGNED_DIRECTORY"
          if($LASTEXITCODE){throw 'Returned signature validation failed; unsigned fallback is forbidden'}
          python packaging/package.py checksums dist
          if($LASTEXITCODE){throw 'Final signed-byte checksums failed'}
      - name: Record actual signature status and final-byte release metadata
        shell: pwsh
        run: |
          if($env:CITRUS_SIGNING -eq 'signpath'){
            python packaging/release-metadata.py --require-signed
          }else{
            python packaging/release-metadata.py
          }
          if($LASTEXITCODE){throw 'Public release metadata failed'}
      - name: Build and verify the small unsigned online installer
        shell: pwsh
        run: |
          python packaging/test-online-installer.py
          if($LASTEXITCODE){throw 'Online installer contracts failed'}
          python packaging/online-installer/build.py --manifest dist/release-manifest.json --output dist/online-installer
          if($LASTEXITCODE){throw 'Online installer build failed'}
      - name: Upload complete assets to a draft only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing=gh release view $env:CITRUS_RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if($LASTEXITCODE -eq 0){
            if($existing -cne 'true'){throw 'Refuse replacement of an already published installer'}
          }else{
            $preview=$env:CITRUS_RELEASE_TAG.Contains('-')
            $arguments=@('release','create',$env:CITRUS_RELEASE_TAG,'--draft','--title',('Citrus '+$env:CITRUS_RELEASE_TAG),'--notes','Verified automated packaging draft. Promote only after native workflow, clean-machine, visual and public-download checks.')
            if($preview){$arguments+='--prerelease'}
            & gh @arguments
            if($LASTEXITCODE){throw 'Draft creation failed'}
          }
          gh release upload $env:CITRUS_RELEASE_TAG dist/Citrus-Setup.exe dist/release-manifest.json dist/release/SHA256SUMS --clobber
          if($LASTEXITCODE){throw 'Complete draft upload failed'}
          gh release upload $env:CITRUS_RELEASE_TAG dist/online-installer/Citrus-Web-Setup.exe dist/online-installer/web-installer-manifest.json dist/online-installer/SHA256SUMS-web-installer --clobber
          if($LASTEXITCODE){throw 'Online installer draft upload failed'}
          $release=gh release view $env:CITRUS_RELEASE_TAG --json assets,isDraft | ConvertFrom-Json
          $expected=Get-Content dist/release-manifest.json -Raw | ConvertFrom-Json
          $asset=@($release.assets|Where-Object name -ceq 'Citrus-Setup.exe')
          if($release.isDraft -ne $true -or $asset.Count -ne 1 -or $asset[0].size -ne $expected.installer.bytes -or $asset[0].digest -cne ('sha256:'+$expected.installer.sha256)){throw 'Draft asset digest/size verification failed'}
          $online=Get-Content dist/online-installer/web-installer-manifest.json -Raw | ConvertFrom-Json
          $webAsset=@($release.assets|Where-Object name -ceq 'Citrus-Web-Setup.exe')
          if($webAsset.Count -ne 1 -or $webAsset[0].size -ne $online.installer.bytes -or $webAsset[0].digest -cne ('sha256:'+$online.installer.sha256)){throw 'Online installer draft digest/size verification failed'}
          Write-Output 'Draft is complete. It is intentionally excluded from application update feeds until publication.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-metadata-and-test-receipts
          path: |
            dist/release-manifest.json
            dist/release/SHA256SUMS
            dist/online-installer/web-installer-manifest.json
            dist/online-installer/SHA256SUMS-web-installer
            .local/update-*.log
          if-no-files-found: warn
